/* ------------------------------------------------------------------
   跨电脑同步：把数据直接读写到一个 JSON 文件（放 OneDrive 即可同步）
   文件句柄存在 IndexedDB 里 —— localStorage 存不下这种对象
   ------------------------------------------------------------------ */
const FS_OK = typeof window !== "undefined" && "showSaveFilePicker" in window;

const idbOpen = () => new Promise((res, rej) => {
  const req = indexedDB.open("qe-planner-fs", 1);
  req.onupgradeneeded = () => req.result.createObjectStore("kv");
  req.onsuccess = () => res(req.result);
  req.onerror = () => rej(req.error);
});
const idbGet = async (k) => {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readonly").objectStore("kv").get(k);
    t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error);
  });
};
const idbPut = async (k, v) => {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readwrite").objectStore("kv").put(v, k);
    t.onsuccess = () => res(); t.onerror = () => rej(t.error);
  });
};
const idbDel = async (k) => {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const t = db.transaction("kv", "readwrite").objectStore("kv").delete(k);
    t.onsuccess = () => res(); t.onerror = () => rej(t.error);
  });
};

const readHandle = async (h) => {
  const f = await h.getFile();
  const text = await f.text();
  return text.trim() ? JSON.parse(text) : null;
};
const writeHandle = async (h, payload) => {
  const w = await h.createWritable();
  await w.write(JSON.stringify(payload, null, 2));
  await w.close();
};
const stamp = (t) => new Date(t).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const freshSeed = () => JSON.parse(JSON.stringify(SEED));

/* ------------------------------------------------------------------ */
/* bulk paste: "# 二级板块" / "## 三级板块" / other lines = readings    */
function parseBulk(text) {
  const secs = [];
  let cs = null, cg = null;
  const ensureS = () => { if (!cs) { cs = { name: "未分板块", groups: [] }; secs.push(cs); cg = null; } };
  const ensureG = () => { ensureS(); if (!cg) { cg = { name: "未分组", items: [] }; cs.groups.push(cg); } };
  text.split("\n").forEach((raw) => {
    const line = raw.trim();
    if (!line) return;
    const h = line.match(/^(#+)\s*(.*)$/);
    if (h) {
      if (h[1].length === 1) { cs = { name: h[2].trim() || "未命名", groups: [] }; secs.push(cs); cg = null; }
      else { ensureS(); cg = { name: h[2].trim() || "未命名", items: [] }; cs.groups.push(cg); }
      return;
    }
    ensureG();
    let s = line.replace(/^[-*•]\s*/, "").replace(/^\d+[.)]\s*/, "").replace(/\s*#.*$/, "").trim();
    s = s.replace(/\s*\((?:\[\d{4}\]\s*)?\d{4}\)\s*$/, "").replace(/[;；]\s*$/, "").trim();
    let author = "", title = s;
    const q = s.search(/["\u201C\u300A]/);
    if (q > 0) { author = s.slice(0, q).replace(/[,，、]\s*$/, "").trim(); title = s.slice(q).trim(); }
    else if (q !== 0) {
      const ed = s.match(/\beds?\.?,\s+/);
      const al = s.match(/,\s+and\s+[^,]+,\s+/);
      const cut = ed ? ed.index + ed[0].length : (al ? al.index + al[0].length : null);
      if (cut !== null) { author = s.slice(0, cut).replace(/,\s*$/, "").trim(); title = s.slice(cut).trim(); }
      else {
        const c = s.search(/[,，]/);
        if (c > 0) { author = s.slice(0, c).trim(); title = s.slice(c + 1).trim(); }
      }
    }
    const PAIRS = { "\u201C": "\u201D", '"': '"', "\u300A": "\u300B", "\u300C": "\u300D" };
    if (PAIRS[title[0]] && title.slice(-1) === PAIRS[title[0]] && title.length > 2)
      title = title.slice(1, -1).trim();
    title = title.replace(/[,，]\s*$/, "").trim();
    if (title) cg.items.push({ author, title });
  });
  return secs.filter((s) => s.groups.some((g) => g.items.length));
}

/* ------------------------------------------------------------------ */
function QEPlanner() {
  const [data, setData] = useState(null);
  const [saveErr, setSaveErr] = useState(false);
  const [held, setHeld] = useState(null);
  const [openDay, setOpenDay] = useState(null);
  const [organize, setOrganize] = useState(null);
  const [editing, setEditing] = useState(null);
  const [showBulk, setShowBulk] = useState(false);
  const [bulk, setBulk] = useState("");
  const [replaceMode, setReplaceMode] = useState(false);
  const [newBook, setNewBook] = useState({});
  const [dragOver, setDragOver] = useState(null);
  const [dragList, setDragList] = useState(null);
  const [dropList, setDropList] = useState(null);
  const [filter, setFilter] = useState("all");
  const [fold, setFold] = useState({});
  const [showAdd, setShowAdd] = useState(false);
  const [resizing, setResizing] = useState(false);
  const [statusFilter, setStatusFilter] = useState("all");
  const [fh, setFh] = useState(null);        // FileSystemFileHandle
  const [perm, setPerm] = useState("prompt");
  const [syncMsg, setSyncMsg] = useState("");
  const stampRef = useRef(0);                // 本机数据的最后写入时间
  const [draft, setDraft] = useState({ author: "", title: "", groupId: "A1g1" });
  const fileRef = useRef(null);
  const saveTimer = useRef(null);

  useEffect(() => {
    let alive = true;
    (async () => {
      let local = null;
      try {
        const raw = localStorage.getItem(STORE_KEY);
        local = raw ? JSON.parse(raw) : null;
      } catch { local = null; }
      if (!alive) return;
      stampRef.current = (local && local.updatedAt) || 0;
      setData(local || freshSeed());
      if (!FS_OK) return;
      try {
        const h = await idbGet("fileHandle");
        if (!h || !alive) return;
        setFh(h);
        const p = await h.queryPermission({ mode: "readwrite" });
        setPerm(p);
        if (p === "granted") {
          const remote = await readHandle(h);
          if (remote && alive && (remote.updatedAt || 0) > stampRef.current) {
            if (window.confirm(`同步文件里有更新的数据（${stamp(remote.updatedAt)}），载入吗？\n本机当前的版本会被替换。`)) {
              stampRef.current = remote.updatedAt || 0;
              setData(remote);
            }
          }
        }
      } catch (err) { /* 文件不可用时静默降级为本机存储 */ }
    })();
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    if (!data) return;
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const now = Date.now();
      stampRef.current = now;
      const payload = { ...data, updatedAt: now };
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(payload));
        setSaveErr(false);
      } catch { setSaveErr(true); }
      if (fh && perm === "granted") {
        try { await writeHandle(fh, payload); setSyncMsg(""); }
        catch (err) { setSyncMsg("写入同步文件失败"); }
      }
    }, 600);
    return () => clearTimeout(saveTimer.current);
  }, [data, fh, perm]);

  useEffect(() => {
    const h = (e) => {
      if (e.key !== "Escape") return;
      if (editing) setEditing(null);
      else if (showBulk) setShowBulk(false);
      else { setHeld(null); setOpenDay(null); setOrganize(null); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [editing, showBulk]);

  const patch = useCallback((fn) => setData((d) => (d ? fn({ ...d }) : d)), []);

  /* 左栏宽度：拖动中缝调节，存进数据所以刷新后保持 */
  const startResize = (e) => {
    e.preventDefault();
    const x0 = e.clientX;
    const w0 = (data && data.poolWidth) || 356;
    setResizing(true);
    const move = (ev) => {
      const w = Math.max(240, Math.min(680, w0 + ev.clientX - x0));
      setData((d) => (d ? { ...d, poolWidth: w } : d));
    };
    const up = () => {
      setResizing(false);
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    };
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
  };

  const gIndex = useMemo(() => {
    const m = {};
    (data?.lists || []).forEach((l) => l.sections.forEach((s) =>
      s.groups.forEach((g) => { m[g.id] = { list: l, section: s, group: g }; })));
    return m;
  }, [data]);

  const personList = useMemo(() => {
    const m = {};
    (data?.people || []).forEach((p) => { m[p.name] = p.listId; });
    return m;
  }, [data]);

  const blocked = useCallback((k) => {
    if (!data) return false;
    if (data.meetings[k]) return true;
    return (data.teachDays || []).includes(dow(k));
  }, [data]);

  const weeks = useMemo(() => {
    if (!data) return [];
    const last = fromKey(data.exam);
    const out = [];
    let cur = startOfWeek(fromKey(data.start));
    let g = 0;
    while (cur <= last && g++ < 160) {
      out.push(Array.from({ length: 7 }, (_, i) => toKey(addDays(cur, i))));
      cur = addDays(cur, 7);
    }
    return out;
  }, [data]);

  const byDate = useMemo(() => {
    const m = {};
    (data?.readings || []).forEach((x) => { if (x.date) (m[x.date] = m[x.date] || []).push(x); });
    return m;
  }, [data]);

  const stats = useMemo(() => {
    if (!data) return null;
    const rs = data.readings;
    const un = rs.filter((x) => !x.date).length;
    const done = rs.filter((x) => x.done).length;
    const daysLeft = Math.max(0, daysBetween(todayKey, data.exam));
    let free = 0;
    for (let i = 0; i <= daysLeft; i++) if (!blocked(toKey(addDays(new Date(), i)))) free++;
    const perList = data.lists.map((l) => ({
      color: l.color,
      done: rs.filter((x) => x.done && gIndex[x.groupId] && gIndex[x.groupId].list.id === l.id).length,
    }));
    return { total: rs.length, un, done, daysLeft, free,
             rate: free ? un / free : 0, perList };
  }, [data, blocked, gIndex]);

  const peak = useMemo(() => {
    const c = weeks.map((w) => w.reduce((s, k) => s + (byDate[k] ? byDate[k].length : 0), 0));
    return Math.max(4, ...c);
  }, [weeks, byDate]);

  /* ---------- readings ---------- */
  const assign = (id, k) => {
    patch((d) => { d.readings = d.readings.map((x) => (x.id === id ? { ...x, date: k } : x)); return d; });
    setHeld(null);
  };
  const unassign = (id) => patch((d) => { d.readings = d.readings.map((x) => (x.id === id ? { ...x, date: null } : x)); return d; });
  const toggleDone = (id) => patch((d) => { d.readings = d.readings.map((x) => (x.id === id ? { ...x, done: !x.done } : x)); return d; });
  const updateReading = (id, f) => patch((d) => { d.readings = d.readings.map((x) => (x.id === id ? { ...x, ...f } : x)); return d; });
  const removeReading = (id) => patch((d) => { d.readings = d.readings.filter((x) => x.id !== id); return d; });

  const addReading = () => {
    if (!draft.title.trim()) return;
    patch((d) => {
      d.readings = [...d.readings, { id: uid(), groupId: draft.groupId,
        author: draft.author.trim(), title: draft.title.trim(), note: "", date: null, done: false }];
      return d;
    });
    setDraft((s) => ({ ...s, author: "", title: "" }));
  };
  const addBookToGroup = (gid) => {
    const v = newBook[gid];
    if (!v || !(v.title || "").trim()) return;
    patch((d) => {
      d.readings = [...d.readings, { id: uid(), groupId: gid,
        author: (v.author || "").trim(), title: v.title.trim(), note: "", date: null, done: false }];
      return d;
    });
    setNewBook((s) => ({ ...s, [gid]: { author: "", title: "" } }));
  };

  /* ---------- sections & groups ---------- */
  const reorderLists = (fromId, toId) => patch((d) => {
    const ls = [...d.lists];
    const from = ls.findIndex((l) => l.id === fromId);
    const to = ls.findIndex((l) => l.id === toId);
    if (from < 0 || to < 0 || from === to) return d;
    const [moved] = ls.splice(from, 1);
    ls.splice(to, 0, moved);
    d.lists = ls;
    return d;
  });

  const mapList = (d, lid, fn) => { d.lists = d.lists.map((l) => (l.id === lid ? fn(l) : l)); return d; };

  const renameSection = (lid, sid, name) => patch((d) => mapList(d, lid, (l) =>
    ({ ...l, sections: l.sections.map((s) => (s.id === sid ? { ...s, name } : s)) })));
  const addSection = (lid) => patch((d) => mapList(d, lid, (l) =>
    ({ ...l, sections: [...l.sections, { id: uid(), name: "新二级板块", groups: [{ id: uid(), name: "新三级板块" }] }] })));
  const deleteSection = (lid, sid) => {
    const list = data.lists.find((l) => l.id === lid);
    const sec = list.sections.find((s) => s.id === sid);
    const gids = sec.groups.map((g) => g.id);
    const n = data.readings.filter((x) => gids.includes(x.groupId)).length;
    if (!window.confirm(`删除二级板块「${sec.name}」，含 ${sec.groups.length} 个三级板块、${n} 项书目？`)) return;
    patch((d) => {
      d.readings = d.readings.filter((x) => !gids.includes(x.groupId));
      return mapList(d, lid, (l) => ({ ...l, sections: l.sections.filter((s) => s.id !== sid) }));
    });
  };
  const moveSection = (lid, sid, dir) => patch((d) => mapList(d, lid, (l) => {
    const ss = [...l.sections];
    const i = ss.findIndex((s) => s.id === sid), j = i + dir;
    if (i < 0 || j < 0 || j >= ss.length) return l;
    const t = ss[i]; ss[i] = ss[j]; ss[j] = t;
    return { ...l, sections: ss };
  }));

  const renameGroup = (lid, sid, gid, name) => patch((d) => mapList(d, lid, (l) =>
    ({ ...l, sections: l.sections.map((s) => (s.id !== sid ? s
      : { ...s, groups: s.groups.map((g) => (g.id === gid ? { ...g, name } : g)) })) })));
  const addGroup = (lid, sid) => patch((d) => mapList(d, lid, (l) =>
    ({ ...l, sections: l.sections.map((s) => (s.id !== sid ? s
      : { ...s, groups: [...s.groups, { id: uid(), name: "新三级板块" }] })) })));
  const deleteGroup = (lid, sid, gid) => {
    const n = data.readings.filter((x) => x.groupId === gid).length;
    const nm = gIndex[gid] ? gIndex[gid].group.name : "";
    if (!window.confirm(n ? `删除三级板块「${nm}」及其 ${n} 项书目？` : `删除空板块「${nm}」？`)) return;
    patch((d) => {
      d.readings = d.readings.filter((x) => x.groupId !== gid);
      return mapList(d, lid, (l) => ({ ...l, sections: l.sections.map((s) => (s.id !== sid ? s
        : { ...s, groups: s.groups.filter((g) => g.id !== gid) })) }));
    });
  };
  const moveGroup = (lid, sid, gid, dir) => patch((d) => mapList(d, lid, (l) =>
    ({ ...l, sections: l.sections.map((s) => {
      if (s.id !== sid) return s;
      const gs = [...s.groups];
      const i = gs.findIndex((g) => g.id === gid), j = i + dir;
      if (i < 0 || j < 0 || j >= gs.length) return s;
      const t = gs[i]; gs[i] = gs[j]; gs[j] = t;
      return { ...s, groups: gs };
    }) })));

  const applyBulk = () => {
    const secs = parseBulk(bulk);
    if (!secs.length) { window.alert("没解析出任何书目。# 是二级板块，## 是三级板块，其余每行一本。"); return; }
    const n = secs.reduce((a, s) => a + s.groups.reduce((b, g) => b + g.items.length, 0), 0);
    if (replaceMode && !window.confirm(`将替换这个书单现有的全部板块与书目（含已排入日历的），改为 ${secs.length} 个二级板块 / ${n} 项。继续？`)) return;
    patch((d) => {
      const li = d.lists.findIndex((l) => l.id === organize);
      if (li < 0) return d;
      const list = { ...d.lists[li] };
      const oldG = list.sections.flatMap((s) => s.groups.map((g) => g.id));
      const fresh = secs.map((s) => ({ id: uid(), name: s.name,
        groups: s.groups.map((g) => ({ id: uid(), name: g.name, _items: g.items })) }));
      const strip = fresh.map((s) => ({ id: s.id, name: s.name,
        groups: s.groups.map((g) => ({ id: g.id, name: g.name })) }));
      if (replaceMode) {
        d.readings = d.readings.filter((x) => !oldG.includes(x.groupId));
        list.sections = strip;
      } else {
        list.sections = [...list.sections, ...strip];
      }
      const add = [];
      fresh.forEach((s) => s.groups.forEach((g) => g._items.forEach((it) =>
        add.push({ id: uid(), groupId: g.id, author: it.author, title: it.title, note: "", date: null, done: false }))));
      d.readings = [...d.readings, ...add];
      d.lists = [...d.lists]; d.lists[li] = list;
      return d;
    });
    setBulk(""); setReplaceMode(false); setShowBulk(false);
  };

  const autoDistribute = () => patch((d) => {
    const pool = d.readings.filter((x) => !x.date &&
      (filter === "all" || (gIndex[x.groupId] && gIndex[x.groupId].list.id === filter)));
    if (!pool.length) return d;
    const slots = [];
    const total = Math.max(0, daysBetween(todayKey, d.exam));
    for (let i = 0; i <= total; i++) {
      const k = toKey(addDays(new Date(), i));
      if (d.meetings[k]) continue;
      if ((d.teachDays || []).includes(dow(k))) continue;
      slots.push(k);
    }
    if (!slots.length) return d;
    const map = {};
    pool.forEach((x, i) => { map[x.id] = slots[Math.floor((i * slots.length) / pool.length)]; });
    d.readings = d.readings.map((x) => (map[x.id] ? { ...x, date: map[x.id] } : x));
    return d;
  });

  const togglePerson = (k, p) => patch((d) => {
    const m = { ...(d.meetings[k] || { people: [], note: "" }) };
    m.people = m.people.includes(p) ? m.people.filter((y) => y !== p) : [...m.people, p];
    const next = { ...d.meetings };
    if (!m.people.length && !m.note) delete next[k]; else next[k] = m;
    d.meetings = next; return d;
  });
  const setNote = (k, note) => patch((d) => {
    const m = { ...(d.meetings[k] || { people: [], note: "" }), note };
    const next = { ...d.meetings };
    if (!m.people.length && !note) delete next[k]; else next[k] = m;
    d.meetings = next; return d;
  });

  const resetAll = async () => {
    if (!window.confirm("清空全部数据，恢复到最初的书单？排好的日期、会面、笔记都会消失，且无法撤销。建议先导出一份。")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (err) { /* 没有记录时忽略 */ }
    setData(freshSeed());
  };

  const bindFile = async () => {
    try {
      let h;
      const opts = {
        suggestedName: "qe-plan.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      };
      const mode = window.confirm(
        "选“确定”：打开一个已有的同步文件（另一台电脑已经建好的）。\n选“取消”：新建一个同步文件。");
      if (mode) {
        const picked = await window.showOpenFilePicker({ types: opts.types, multiple: false });
        h = picked[0];
      } else {
        h = await window.showSaveFilePicker(opts);
      }
      const p = await h.requestPermission({ mode: "readwrite" });
      if (p !== "granted") { setSyncMsg("没有写入权限"); return; }
      await idbPut("fileHandle", h);
      setFh(h); setPerm("granted"); setSyncMsg("");
      const remote = await readHandle(h).catch(() => null);
      if (remote && remote.lists) {
        const useRemote = window.confirm(
          `这个文件里已有数据（${remote.updatedAt ? stamp(remote.updatedAt) : "时间未知"}）。\n` +
          "选“确定”：用文件里的数据覆盖本机。\n选“取消”：用本机数据覆盖文件。");
        if (useRemote) { stampRef.current = remote.updatedAt || 0; setData(remote); return; }
      }
      await writeHandle(h, { ...data, updatedAt: Date.now() });
    } catch (err) { /* 用户取消选择 */ }
  };

  const reconnect = async () => {
    if (!fh) return;
    try {
      const p = await fh.requestPermission({ mode: "readwrite" });
      setPerm(p);
      if (p === "granted") await pullFile();
    } catch (err) { setSyncMsg("重新连接失败"); }
  };

  const pullFile = async () => {
    if (!fh) return;
    try {
      const remote = await readHandle(fh);
      if (!remote || !remote.lists) { setSyncMsg("文件里没有可用数据"); return; }
      const t = remote.updatedAt || 0;
      if (t <= stampRef.current &&
          !window.confirm(`文件里的数据并不更新（${t ? stamp(t) : "时间未知"}），仍要载入吗？`)) return;
      stampRef.current = t;
      setData(remote);
      setSyncMsg("");
    } catch (err) { setSyncMsg("读取同步文件失败"); }
  };

  const unbindFile = async () => {
    if (!window.confirm("断开同步文件？本机数据保留，文件也不会删除。")) return;
    await idbDel("fileHandle").catch(() => {});
    setFh(null); setPerm("prompt"); setSyncMsg("");
  };

  /* 切回这个窗口时，检查另一台电脑是否写过 */
  useEffect(() => {
    if (!fh || perm !== "granted") return;
    const onFocus = async () => {
      try {
        const remote = await readHandle(fh);
        if (remote && (remote.updatedAt || 0) > stampRef.current + 1500) {
          if (window.confirm(`同步文件在别处更新过（${stamp(remote.updatedAt)}），载入吗？`)) {
            stampRef.current = remote.updatedAt;
            setData(remote);
          } else {
            stampRef.current = remote.updatedAt;   // 拒绝一次就不再反复问
          }
        }
      } catch (err) { /* 忽略 */ }
    };
    window.addEventListener("focus", onFocus);
    return () => window.removeEventListener("focus", onFocus);
  }, [fh, perm]);

  const exportJSON = () => {
    const b = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "qe-plan.json"; a.click();
    URL.revokeObjectURL(a.href);
  };
  const importJSON = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { try { setData(JSON.parse(fr.result)); } catch { window.alert("读不出来，需要是本工具导出的 JSON。"); } };
    fr.readAsText(f); e.target.value = "";
  };

  const bandFor = (k) => {
    const meet = data.meetings[k];
    if (!meet || !meet.people.length) return null;
    const order = [], bucket = {};
    meet.people.forEach((p) => {
      const lid = personList[p] || "_";
      if (!bucket[lid]) { bucket[lid] = []; order.push(lid); }
      bucket[lid].push(p);
    });
    return order.map((lid) => {
      const l = data.lists.find((x) => x.id === lid);
      return { color: l ? l.color : NEUTRAL, names: bucket[lid] };
    });
  };

  if (!data) return <div style={{ padding: 30, fontFamily: "system-ui", color: "#767C72" }}>正在读取计划…</div>;

  const matchStatus = (x) => {
    if (statusFilter === "unplaced") return !x.date;
    if (statusFilter === "placed") return !!x.date;
    if (statusFilter === "unread") return !x.done;
    if (statusFilter === "done") return x.done;
    return true;
  };
  const visible = data.readings.filter(matchStatus);
  const inGroup = (gid) => visible.filter((x) => x.groupId === gid);
  const tree = data.lists
    .filter((l) => filter === "all" || l.id === filter)
    .map((l) => ({ list: l, sections: l.sections
      .map((s) => ({ section: s, groups: s.groups
        .map((g) => ({ group: g, items: inGroup(g.id) })).filter((x) => x.items.length) }))
      .filter((x) => x.groups.length) }))
    .filter((x) => x.sections.length);

  const meetingKeys = Object.keys(data.meetings).sort();
  const readingsBefore = (k) => {
    const i = meetingKeys.indexOf(k);
    const prev = i > 0 ? meetingKeys[i - 1] : data.start;
    return data.readings.filter((x) => x.date && x.date > prev && x.date <= k).length;
  };

  const orgList = data.lists.find((l) => l.id === organize);
  const editRec = editing ? data.readings.find((x) => x.id === editing) : null;
  const pct = stats.total ? Math.round((stats.done / stats.total) * 100) : 0;

  const groupOptions = data.lists.map((l) => (
    <optgroup key={l.id} label={l.name}>
      {l.sections.flatMap((s) => s.groups.map((g) =>
        <option key={g.id} value={g.id}>{s.name} · {g.name}</option>))}
    </optgroup>
  ));

  return (
    <div className="qe">
      <style>{CSS}</style>

      {/* progress */}
      <div className="qe-prog">
        <div className="qe-track2">
          {stats.perList.map((p, i) => p.done > 0 && (
            <div key={i} className="qe-seg"
              style={{ width: `${(p.done / stats.total) * 100}%`, background: p.color }} />
          ))}
        </div>
        <span className="qe-pnum">已读 <b>{stats.done}</b> / {stats.total} · <b>{pct}%</b></span>
        {FS_OK && (
          <span className="qe-sync">
            {!fh && <button className="qe-btn" onClick={bindFile}>连接同步文件</button>}
            {fh && perm !== "granted" && (
              <button className="qe-btn warn" onClick={reconnect}>同步文件待授权 · 点此连接</button>
            )}
            {fh && perm === "granted" && (
              <>
                <span className="qe-syncdot" />
                <span className="qe-syncname" title={fh.name}>{fh.name}</span>
                <button className="qe-btn sm" onClick={pullFile} title="从文件载入另一台电脑的改动">载入</button>
                <button className="qe-btn sm" onClick={unbindFile} title="断开">断开</button>
              </>
            )}
            {syncMsg && <span className="qe-syncerr">{syncMsg}</span>}
          </span>
        )}
      </div>

      <div className="qe-top">
        <div className="qe-rate">
          <b>{stats.rate ? stats.rate.toFixed(1) : "0"}</b>
          <span>每个可用日需读完的书目数</span>
        </div>
        <div className="qe-stat"><i>未排</i><b>{stats.un}</b></div>
        <div className="qe-stat"><i>已排</i><b>{stats.total - stats.un}</b></div>
        <div className="qe-stat"><i>可用日</i><b>{stats.free}</b></div>
        <div className="qe-stat"><i>距考试</i><b>{stats.daysLeft}</b></div>
        <div className="qe-dates">
          <label className="qe-field"><i>起始</i>
            <input type="date" value={data.start}
              onChange={(e) => patch((d) => { d.start = e.target.value; return d; })} /></label>
          <label className="qe-field"><i>考试</i>
            <input type="date" value={data.exam}
              onChange={(e) => patch((d) => { d.exam = e.target.value; return d; })} /></label>
        </div>
      </div>

      <div className="qe-body">
        {/* pool */}
        <div className="qe-pool" style={{ width: (data.poolWidth || 356) + "px" }}
          onDragOver={(e) => e.preventDefault()}
          onDrop={(e) => { e.preventDefault(); const id = e.dataTransfer.getData("text/plain"); if (id) unassign(id); }}>

          <div className="qe-poolhead">
            <h2>书目总目</h2>
            <em>{visible.length} / {stats.total}　已排 {stats.total - stats.un}　已读 {stats.done}</em>
          </div>

          <div className="qe-tools">
            <select className="qe-btn" value={filter} onChange={(e) => setFilter(e.target.value)}>
              <option value="all">四个书单</option>
              {data.lists.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
            <button className="qe-btn" onClick={autoDistribute}>自动排布</button>
            <select className="qe-btn" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
              <option value="all">全部状态</option>
              <option value="unplaced">未排日期</option>
              <option value="placed">已排日期</option>
              <option value="unread">未读完</option>
              <option value="done">已读完</option>
            </select>
            <button className="qe-btn" onClick={() => {
              const allOpen = data.lists.every((l) => !fold[l.id]);
              const next = {};
              if (allOpen) data.lists.forEach((l) => { next[l.id] = true; });
              setFold(next);
            }}>折叠</button>
            <button className="qe-btn" onClick={() => setOrganize(data.lists[0] && data.lists[0].id)}>编辑书单</button>
          </div>

          <div className="qe-poollist">
            {!tree.length && <p className="qe-empty">这里空了。书目都已排入日历，或被筛选隐藏。</p>}
            {tree.map(({ list, sections }) => {
              const n = sections.reduce((a, s) => a + s.groups.reduce((b, g) => b + g.items.length, 0), 0);
              return (
                <div key={list.id}>
                  <button
                    className={"qe-lhead" + (filter === "all" ? " grab" : "")
                      + (dragList === list.id ? " dragging" : "")
                      + (dropList === list.id ? " dropinto" : "")}
                    draggable={filter === "all"}
                    onDragStart={(e) => {
                      e.dataTransfer.setData("application/x-qe-list", list.id);
                      e.dataTransfer.effectAllowed = "move";
                      setDragList(list.id);
                    }}
                    onDragEnd={() => { setDragList(null); setDropList(null); }}
                    onDragOver={(e) => {
                      if (dragList && dragList !== list.id) {
                        e.preventDefault(); e.stopPropagation(); setDropList(list.id);
                      }
                    }}
                    onDragLeave={() => setDropList((x) => (x === list.id ? null : x))}
                    onDrop={(e) => {
                      const from = e.dataTransfer.getData("application/x-qe-list");
                      if (from) { e.preventDefault(); e.stopPropagation(); reorderLists(from, list.id); }
                      setDragList(null); setDropList(null);
                    }}
                    onClick={() => setFold((f) => ({ ...f, [list.id]: !f[list.id] }))}>
                    <span className="qe-swatch" style={{ background: list.color }} />
                    <span className="qe-lname"><b>{list.name}</b><i>{list.examiner}</i></span>
                    {filter === "all" && <span className="qe-grip" title="拖动可调整书单顺序">⣿</span>}
                    <span className="qe-count">{fold[list.id] ? "+" : "–"} {n}</span>
                  </button>
                  {!fold[list.id] && sections.map(({ section, groups }) => {
                    const sn = groups.reduce((a, g) => a + g.items.length, 0);
                    return (
                      <div key={section.id}>
                        <button className="qe-shead" onClick={() => setFold((f) => ({ ...f, [section.id]: !f[section.id] }))}>
                          <span className="qe-caret">{fold[section.id] ? "▶" : "▼"}</span>
                          <span className="qe-label">{section.name}</span>
                          <span className="qe-count">{sn}</span>
                        </button>
                        {!fold[section.id] && groups.map(({ group, items }) => (
                          <div key={group.id}>
                            <button className="qe-ghead" onClick={() => setFold((f) => ({ ...f, [group.id]: !f[group.id] }))}>
                              <span className="qe-caret">{fold[group.id] ? "▶" : "▼"}</span>
                              <span className="qe-label">{group.name}</span>
                              <span className="qe-count">{items.length}</span>
                            </button>
                            {!fold[group.id] && items.map((x) => (
                              <div key={x.id}
                                className={"qe-item" + (held === x.id ? " held" : "")
                                  + (x.date ? " placed" : "") + (x.done ? " done" : "")}
                                draggable
                                onDragStart={(e) => e.dataTransfer.setData("text/plain", x.id)}
                                onClick={() => setHeld((h) => (h === x.id ? null : x.id))}
                                title={x.date ? "已排在 " + x.date + "，拖动可改期" : "拖到日期上，或点选后再点日期"}>
                                <span className="qe-meta">
                                  {x.author && <span className="qe-auth">{x.author}</span>}
                                  <span className="qe-title">
                                    {x.title}{x.note && <span className="qe-hasnote" title={x.note}> ✱</span>}
                                  </span>
                                </span>
                                {x.date && (
                                  <button className="qe-datechip" title="点击撤回日期"
                                    onClick={(e) => { e.stopPropagation(); unassign(x.id); }}>
                                    {fromKey(x.date).getMonth() + 1}/{fromKey(x.date).getDate()}
                                  </button>
                                )}
                                <button className="qe-edit" title={x.done ? "标记为未读" : "标记为读完"}
                                  onClick={(e) => { e.stopPropagation(); toggleDone(x.id); }}>
                                  {x.done ? "✓" : "○"}
                                </button>
                                <button className="qe-edit" title="编辑这一条"
                                  onClick={(e) => { e.stopPropagation(); setEditing(x.id); }}>✎</button>
                              </div>
                            ))}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>

          <div className="qe-add">
            <button className="qe-addtoggle" onClick={() => setShowAdd((v) => !v)}>
              <span className="qe-caret">{showAdd ? "\u25bc" : "\u25b6"}</span>
              <span style={{ flex: 1 }}>添加书目 · 导入导出</span>
            </button>
            {showAdd && <div className="qe-addbody">
            <input placeholder="书名 / 篇名" value={draft.title}
              onChange={(e) => setDraft({ ...draft, title: e.target.value })}
              onKeyDown={(e) => e.key === "Enter" && addReading()} />
            <input placeholder="作者" value={draft.author}
              onChange={(e) => setDraft({ ...draft, author: e.target.value })}
              onKeyDown={(e) => e.key === "Enter" && addReading()} />
            <div className="qe-addrow">
              <select value={draft.groupId} onChange={(e) => setDraft({ ...draft, groupId: e.target.value })}>
                {groupOptions}
              </select>
              <button className="qe-btn" onClick={addReading}>加入</button>
            </div>
            <div className="qe-addrow" style={{ marginTop: 2 }}>
              <button className="qe-btn" onClick={exportJSON}>导出</button>
              <button className="qe-btn" onClick={() => fileRef.current && fileRef.current.click()}>导入</button>
              <button className="qe-btn" onClick={() => {
                if (window.confirm("把所有已排书目退回左栏？会面日不受影响。"))
                  patch((d) => { d.readings = d.readings.map((x) => ({ ...x, date: null })); return d; });
              }}>全部退回</button>
              <button className="qe-btn" onClick={resetAll}>清空重来</button>
              <input ref={fileRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importJSON} />
            </div>
            {saveErr && <p style={{ margin: 0, color: "#C0392B", fontSize: 11 }}>保存失败，改动只在当前页面。先导出一份。</p>}
            </div>}
          </div>
        </div>

        <div className={"qe-split" + (resizing ? " on" : "")}
          onMouseDown={startResize} title="拖动调整左右宽度" />

        {/* calendar */}
        <div className="qe-cal">
          <div className="qe-wdays">
            {WD.map((d, i) => (
              <div key={d} className={(data.teachDays || []).includes((i + 1) % 7) ? "tg" : ""}>周{d}</div>
            ))}
            <div style={{ borderRight: "none" }}>负荷</div>
          </div>

          {weeks.map((week, wi) => {
            const count = week.reduce((s, k) => s + (byDate[k] ? byDate[k].length : 0), 0);
            const firstOfMonth = week.find((k) => fromKey(k).getDate() === 1);
            const mD = fromKey(firstOfMonth || week[0]);
            return (
              <React.Fragment key={week[0]}>
                {(wi === 0 || firstOfMonth) &&
                  <div className="qe-month">{mD.getFullYear()} 年 {MONTHS[mD.getMonth()]}</div>}
                <div className="qe-week">
                  {week.map((k) => {
                    const items = byDate[k] || [];
                    const band = bandFor(k);
                    const out = k < data.start || k > data.exam;
                    const teach = (data.teachDays || []).includes(dow(k));
                    const cls = ["qe-day"];
                    if (out) cls.push("out");
                    else if (band) cls.push("meet");
                    else if (teach) cls.push("teach");
                    if (k === todayKey) cls.push("today");
                    if (dragOver === k) cls.push("over");
                    let bg = null;
                    if (band && !out) {
                      const w = 100 / band.length;
                      bg = band.length === 1 ? band[0].color
                        : `linear-gradient(90deg,${band.map((s2, i) =>
                            `${s2.color} ${i * w}% ${(i + 1) * w}%`).join(",")})`;
                    }
                    return (
                      <div key={k} className={cls.join(" ")}
                        style={bg ? { background: bg } : null}
                        onDragOver={(e) => { e.preventDefault(); setDragOver(k); }}
                        onDragLeave={() => setDragOver((x) => (x === k ? null : x))}
                        onDrop={(e) => { e.preventDefault(); setDragOver(null);
                          const id = e.dataTransfer.getData("text/plain"); if (id) assign(id, k); }}
                        onClick={() => { if (held) assign(held, k); else setOpenDay(k); }}>
                        <div className="qe-dnum">
                          <span className="qe-num">{fromKey(k).getDate()}</span>
                          {teach && !out && !band && <span className="qe-teachtag">教学</span>}
                          {items.length > 2 && <span className="qe-more">{items.length}</span>}
                        </div>
                        {band && !out && (
                          <div className="qe-names">
                            {band.map((seg, i) => (
                              <div key={i} className="qe-nameseg" title={seg.names.join("、")}>
                                {seg.names.map(surname).join("、")}
                              </div>
                            ))}
                          </div>
                        )}
                        {items.slice(0, 3).map((x) => {
                          const gi = gIndex[x.groupId];
                          const c = gi ? gi.list.color : "#888";
                          return (
                            <div key={x.id} className={"qe-chip" + (x.done ? " done" : "")}
                              draggable
                              onDragStart={(e) => { e.stopPropagation(); e.dataTransfer.setData("text/plain", x.id); }}
                              onClick={(e) => { e.stopPropagation(); toggleDone(x.id); }}
                              style={{ background: tint(c, 0.15), borderLeftColor: c }}
                              title={`${x.title}${x.author ? " — " + x.author : ""}｜${gi ? gi.section.name + " · " + gi.group.name : ""}${x.note ? "｜" + x.note : ""}｜点击标记读完`}>
                              {x.title}
                            </div>
                          );
                        })}
                        {items.length > 3 && <span className="qe-more">还有 {items.length - 3} 项</span>}
                      </div>
                    );
                  })}
                  <div className="qe-load">
                    <span className="qe-loadn">{count} <em>项</em></span>
                    <div className="qe-track">
                      <div className={"qe-fill" + (count > peak * 0.75 ? " hot" : "")}
                        style={{ width: `${Math.min(100, (count / peak) * 100)}%` }} />
                    </div>
                  </div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {held && (
        <div className="qe-held">
          <span>已选中「{(data.readings.find((x) => x.id === held) || {}).title}」，点一个日期放入</span>
          <button onClick={() => setHeld(null)}>取消</button>
        </div>
      )}

      {/* day panel */}
      {openDay && (
        <div className="qe-scrim" onClick={() => setOpenDay(null)}>
          <div className="qe-modal narrow" onClick={(e) => e.stopPropagation()}>
            <div className="qe-mh">
              <div>
                <h3>{fromKey(openDay).getFullYear()} 年 {MONTHS[fromKey(openDay).getMonth()]}{fromKey(openDay).getDate()} 日</h3>
                <p>周{WD[(dow(openDay) + 6) % 7]}
                  {(data.teachDays || []).includes(dow(openDay)) && "　·　教学日"}
                  {data.meetings[openDay] && `　·　会面前累计 ${readingsBefore(openDay)} 项`}</p>
              </div>
              <button className="qe-x" onClick={() => setOpenDay(null)}>✕</button>
            </div>
            <div className="qe-mb">
              <div className="qe-sect">
                <h4>与谁会面</h4>
                <div className="qe-people">
                  {data.people.map((p) => {
                    const l = data.lists.find((x) => x.id === p.listId);
                    const on = data.meetings[openDay] && data.meetings[openDay].people.includes(p.name);
                    return (
                      <button key={p.name} className="qe-pbtn"
                        style={on ? { background: l ? l.color : NEUTRAL, color: "#fff",
                                      borderColor: l ? l.color : NEUTRAL } : null}
                        onClick={() => togglePerson(openDay, p.name)}>
                        {!on && <span className="qe-pdot" style={{ background: l ? l.color : NEUTRAL }} />}
                        {p.name}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div className="qe-sect">
                <h4>备注</h4>
                <textarea className="qe-note" placeholder="这次会面要带什么、要问什么"
                  value={(data.meetings[openDay] || {}).note || ""} onChange={(e) => setNote(openDay, e.target.value)} />
              </div>
              <div className="qe-sect">
                <h4>这天的书目（{(byDate[openDay] || []).length}）</h4>
                {!(byDate[openDay] || []).length && <p className="qe-hint">还没有安排。从左栏拖一本过来。</p>}
                {(byDate[openDay] || []).map((x) => {
                  const gi = gIndex[x.groupId];
                  return (
                    <div className="qe-prow" key={x.id}>
                      <input type="checkbox" checked={x.done} onChange={() => toggleDone(x.id)} />
                      <span style={{ flex: 1, minWidth: 0 }}>
                        <span className="qe-title" style={{ textDecoration: x.done ? "line-through" : "none", opacity: x.done ? 0.5 : 1 }}>{x.title}</span>
                        <span className="qe-auth">
                          {x.author && x.author + "　"}
                          {gi && `${gi.list.name} · ${gi.group.name}`}
                        </span>
                        {x.note && <span className="qe-notetext">{x.note}</span>}
                      </span>
                      <button className="qe-x" title="编辑" onClick={() => setEditing(x.id)}>✎</button>
                      <button className="qe-x" title="退回左栏" onClick={() => unassign(x.id)}>↩</button>
                      <button className="qe-x" title="删除" onClick={() => removeReading(x.id)}>✕</button>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* list editor */}
      {orgList && (
        <div className="qe-scrim" onClick={() => setOrganize(null)}>
          <div className="qe-modal" onClick={(e) => e.stopPropagation()}>
            <div className="qe-mh">
              <div><h3>编辑书单</h3><p>板块名直接改；书目点 ✎ 改标题、作者与归属</p></div>
              <button className="qe-x" onClick={() => setOrganize(null)}>✕</button>
            </div>
            <div className="qe-mb">
              <div className="qe-people">
                {data.lists.map((l) => (
                  <button key={l.id} className={"qe-btn" + (l.id === organize ? " on" : "")}
                    onClick={() => setOrganize(l.id)}>{l.name}</button>
                ))}
              </div>

              <div className="qe-sect">
                <h4>书单名与考官</h4>
                <input className="qe-in" value={orgList.name} style={{ marginBottom: 6 }}
                  onChange={(e) => patch((d) => mapList(d, organize, (l) => ({ ...l, name: e.target.value })))} />
                <input className="qe-in" value={orgList.examiner || ""} placeholder="考官"
                  onChange={(e) => patch((d) => mapList(d, organize, (l) => ({ ...l, examiner: e.target.value })))} />
                <div className="qe-dots" style={{ marginTop: 9 }}>
                  {PALETTE.map((c) => (
                    <button key={c} className={"qe-dot" + (orgList.color === c ? " on" : "")}
                      style={{ background: c }} title={c}
                      onClick={() => patch((d) => mapList(d, organize, (l) => ({ ...l, color: c })))} />
                  ))}
                </div>
              </div>

              <div className="qe-sect">
                <h4>板块与书目</h4>
                {orgList.sections.map((s, si) => (
                  <div className="qe-sec" key={s.id}>
                    <div className="qe-sech">
                      <input value={s.name} onChange={(e) => renameSection(orgList.id, s.id, e.target.value)} />
                      <button className="qe-x" style={{ opacity: si === 0 ? 0.25 : 1 }}
                        title="上移" onClick={() => moveSection(orgList.id, s.id, -1)}>↑</button>
                      <button className="qe-x" style={{ opacity: si === orgList.sections.length - 1 ? 0.25 : 1 }}
                        title="下移" onClick={() => moveSection(orgList.id, s.id, 1)}>↓</button>
                      <button className="qe-x" title="删除二级板块" onClick={() => deleteSection(orgList.id, s.id)}>✕</button>
                    </div>
                    {s.groups.map((g, gi2) => {
                      const books = data.readings.filter((x) => x.groupId === g.id);
                      const nb = newBook[g.id] || { author: "", title: "" };
                      return (
                        <div className="qe-grp" key={g.id}>
                          <div className="qe-grph">
                            <input value={g.name} onChange={(e) => renameGroup(orgList.id, s.id, g.id, e.target.value)} />
                            <span className="qe-count">{books.length}</span>
                            <button className="qe-x" style={{ opacity: gi2 === 0 ? 0.25 : 1 }}
                              title="上移" onClick={() => moveGroup(orgList.id, s.id, g.id, -1)}>↑</button>
                            <button className="qe-x" style={{ opacity: gi2 === s.groups.length - 1 ? 0.25 : 1 }}
                              title="下移" onClick={() => moveGroup(orgList.id, s.id, g.id, 1)}>↓</button>
                            <button className="qe-x" title="删除三级板块" onClick={() => deleteGroup(orgList.id, s.id, g.id)}>✕</button>
                          </div>
                          {books.map((x) => (
                            <div className="qe-book" key={x.id}>
                              <span className="t">{x.title}{x.note && <span className="qe-hasnote"> ✱</span>}</span>
                              <span className="a">{x.author}</span>
                              {x.date && <span className="qe-count" title="已排入日历">◆</span>}
                              <button className="qe-x" title="编辑" onClick={() => setEditing(x.id)}>✎</button>
                              <button className="qe-x" title="删除"
                                onClick={() => { if (window.confirm(`删除「${x.title}」？`)) removeReading(x.id); }}>✕</button>
                            </div>
                          ))}
                          <div className="qe-newbook">
                            <input style={{ flex: 2 }} placeholder="书名" value={nb.title}
                              onChange={(e) => setNewBook((v) => ({ ...v, [g.id]: { ...nb, title: e.target.value } }))}
                              onKeyDown={(e) => e.key === "Enter" && addBookToGroup(g.id)} />
                            <input style={{ flex: 1 }} placeholder="作者" value={nb.author}
                              onChange={(e) => setNewBook((v) => ({ ...v, [g.id]: { ...nb, author: e.target.value } }))}
                              onKeyDown={(e) => e.key === "Enter" && addBookToGroup(g.id)} />
                            <button className="qe-btn sm" onClick={() => addBookToGroup(g.id)}>加</button>
                          </div>
                        </div>
                      );
                    })}
                    <div className="qe-grp" style={{ padding: "5px 8px 6px 16px" }}>
                      <button className="qe-btn sm" onClick={() => addGroup(orgList.id, s.id)}>＋ 三级板块</button>
                    </div>
                  </div>
                ))}
                <div className="qe-addrow" style={{ marginTop: 4 }}>
                  <button className="qe-btn" onClick={() => addSection(orgList.id)}>＋ 二级板块</button>
                  <button className="qe-btn" onClick={() => setShowBulk(true)}>批量粘贴</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* single reading editor */}
      {editRec && (
        <div className="qe-scrim top" onClick={() => setEditing(null)}>
          <div className="qe-modal narrow" onClick={(e) => e.stopPropagation()}>
            <div className="qe-mh">
              <h3>编辑书目</h3>
              <button className="qe-x" onClick={() => setEditing(null)}>✕</button>
            </div>
            <div className="qe-mb">
              <div className="qe-sect">
                <h4>书名 / 篇名</h4>
                <input className="qe-in" autoFocus value={editRec.title}
                  onChange={(e) => updateReading(editRec.id, { title: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && setEditing(null)} />
              </div>
              <div className="qe-sect">
                <h4>作者</h4>
                <input className="qe-in" value={editRec.author || ""}
                  onChange={(e) => updateReading(editRec.id, { author: e.target.value })}
                  onKeyDown={(e) => e.key === "Enter" && setEditing(null)} />
              </div>
              <div className="qe-sect">
                <h4>归属板块</h4>
                <select className="qe-in" value={editRec.groupId}
                  onChange={(e) => updateReading(editRec.id, { groupId: e.target.value })}>
                  {groupOptions}
                </select>
              </div>
              <div className="qe-sect">
                <h4>笔记</h4>
                <textarea className="qe-note" value={editRec.note || ""}
                  placeholder="版本、指定章节、为什么读它"
                  onChange={(e) => updateReading(editRec.id, { note: e.target.value })} />
              </div>
              <div className="qe-addrow" style={{ justifyContent: "space-between" }}>
                <button className="qe-btn" onClick={() => {
                  if (window.confirm(`删除「${editRec.title}」？`)) { removeReading(editRec.id); setEditing(null); }
                }}>删除这一条</button>
                {editRec.date && <button className="qe-btn" onClick={() => unassign(editRec.id)}>退回左栏</button>}
                <button className="qe-btn on" onClick={() => setEditing(null)}>完成</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* bulk paste */}
      {showBulk && orgList && (
        <div className="qe-scrim top" onClick={() => setShowBulk(false)}>
          <div className="qe-modal" onClick={(e) => e.stopPropagation()}>
            <div className="qe-mh">
              <div><h3>批量粘贴</h3><p>写入「{orgList.name}」</p></div>
              <button className="qe-x" onClick={() => setShowBulk(false)}>✕</button>
            </div>
            <div className="qe-mb">
              <p className="qe-hint">
                <code># 二级板块</code>，<code>## 三级板块</code>，其余每行一本。
                作者与书名用逗号或破折号分开；行尾年份、序号、<code>#</code> 注释会被丢掉。
              </p>
              <textarea className="qe-ta" value={bulk} onChange={(e) => setBulk(e.target.value)} autoFocus
                placeholder={"# Systems Fever\n## Futures\n托夫勒,《第三次浪潮》(1984)\nJulian Gewirtz, \"The Futurists of Beijing\" (2019)\n\n## Scientific Methodology\n钱学森等,《论系统工程》(1988)"} />
              <div className="qe-addrow" style={{ alignItems: "center" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 6, flex: 1 }}>
                  <input type="checkbox" checked={replaceMode} onChange={(e) => setReplaceMode(e.target.checked)} />
                  <span style={{ fontSize: 12 }}>替换这个书单现有内容</span>
                </label>
                <button className="qe-btn on" onClick={applyBulk}>写入</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<QEPlanner />);
</script>
</body>
</html>
